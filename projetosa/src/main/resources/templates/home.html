<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #f0f4f8, #d9e2ec);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }

        .card {
            border-radius: 15px;
            background: #ffffffcc; /* leve transparência para o degradê aparecer */
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border: none;
        }

        .card-header {
            background-color: #007bff;
            color: #fff;
            font-weight: 700;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
        }

        .card-body p {
            font-size: 1.1rem;
            font-weight: 500;
        }

        footer {
            text-align: center;
            padding: 20px 0;
            border-top: 1px solid #ccc;
            color: #555;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div th:insert="navbar :: navigation"></div>

<!-- Conteúdo -->
<main class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="card shadow-lg">
                <div class="card-header">
                    <h5>Bem-vindo!</h5>
                </div>
                <div class="card-body">
                    <p class="lead">Você acessou com sucesso o sistema</p>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Rodapé -->
<footer>
    <div class="container">
        <span>© Turma 2025/2 - 2026/2 | SENAI Desenvolvimento de Sistemas</span>
    </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.4/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
