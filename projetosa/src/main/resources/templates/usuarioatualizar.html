<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Usuário</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #f0f4f8, #d9e2ec);
            min-height: 100vh;
            color: #333;
        }

        .card {
            border-radius: 15px;
            background: #ffffffcc;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border: none;
        }

        .card-header {
            background-color: transparent;
            color: #007bff;
            font-weight: 700;
            border-bottom: 2px solid #007bff;
        }

        .form-control-lg {
            border-radius: 10px;
        }

        .btn-primary, .btn-secondary {
            border-radius: 10px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(90deg, #007bff, #0056b3);
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(90deg, #0056b3, #003f7f);
            box-shadow: 0 4px 12px rgba(0,123,255,0.4);
        }

        .btn-secondary {
            background: linear-gradient(90deg, #6c757d, #495057);
            border: none;
            color: #fff;
        }

        .btn-secondary:hover {
            background: linear-gradient(90deg, #495057, #343a40);
            box-shadow: 0 4px 12px rgba(108,117,125,0.4);
        }

        footer {
            text-align: center;
            padding: 20px 0;
            margin-top: 30px;
            border-top: 1px solid #ccc;
            color: #555;
            font-size: 0.9rem;
        }

        .container {
            max-width: 600px;
        }
    </style>
</head>

<body>

<div th:insert="~{navbar :: navigation}"></div>

<div class="container mt-5">
    <div class="card shadow-lg">
        <div class="card-header py-3">
            <h5 class="m-0">Atualizar Usuário</h5>
        </div>
        <div class="card-body">
            <form th:action="@{'/usuario/' + ${usuarioDto.id}}" th:method="post" th:object="${usuarioDto}">

                <div class="form-floating mb-4">
                    <input type="text" id="nome" th:field="*{nome}" class="form-control form-control-lg" />
                    <label for="nome">Nome</label>
                </div>

                <div class="form-floating mb-4">
                    <input type="email" id="email" th:field="*{email}" class="form-control form-control-lg" />
                    <label for="email">E-mail</label>
                </div>

                <div class="form-floating mb-4">
                    <input type="password" id="senha" th:field="*{senha}" class="form-control form-control-lg" />
                    <label for="senha">Senha</label>
                </div>

                <div class="form-floating mb-4">
                    <input type="text" id="matricula" th:field="*{matricula}" class="form-control form-control-lg" />
                    <label for="matricula">Matrícula</label>
                </div>

                <div class="form-floating mb-4">
                    <input type="date" id="dataNascimento" th:field="*{dataNascimento}" class="form-control form-control-lg" />
                    <label for="dataNascimento">Data de Nascimento</label>
                </div>

                <div class="d-flex justify-content-between">
                    <button type="submit" class="btn btn-primary w-50 me-2">Confirmar</button>
                    <a th:href="@{/usuariolista}" class="btn btn-secondary w-50 ms-2">Fechar</a>
                </div>

            </form>

            <div th:if="${param.ins_sucesso}" class="alert alert-info mt-3" role="alert">
                Cadastro realizado com sucesso!
            </div>

            <div th:if="${param.upd_sucesso}" class="alert alert-info mt-3" role="alert">
                Cadastro atualizado com sucesso!
            </div>

        </div>
    </div>
</div>

<footer>
    <p>© Turma 2025-2026</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.4/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
