<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Agendamento</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

  <!-- Fontes Modernas -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* Geral */
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #f0f4f8, #d9e2ec);
      color: #333;
      min-height: 100vh;
    }

    a {
      text-decoration: none;
    }

    /* Card */
    .card {
      border-radius: 15px;
      background: #ffffffcc; /* leve transparência para deixar o degradê do fundo aparecer */
      border: none;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }

    .card-header {
      background-color: transparent;
      color: #007bff;
      font-size: 1.2rem;
      font-weight: 700;
      border-bottom: 2px solid #007bff;
    }

    /* Inputs */
    .form-floating > .form-control {
      background-color: #f8f9fa;
      color: #333;
      border: 1px solid #ccc;
    }

    .form-floating > .form-control:focus {
      border-color: #007bff;
      box-shadow: 0 0 5px rgba(0,123,255,0.5);
      background-color: #ffffff;
    }

    select.form-control {
      background-color: #f8f9fa;
      color: #333;
      border: 1px solid #ccc;
    }

    /* Botões */
    .btn-primary {
      background-color: #007bff;
      border: none;
      transition: 0.3s;
    }
    .btn-primary:hover {
      background-color: #0056b3;
    }

    .btn-secondary {
      background-color: #6c757d;
      border: none;
      transition: 0.3s;
    }
    .btn-secondary:hover {
      background-color: #5a6268;
    }

    /* Alertas */
    .alert-info {
      background-color: #cce5ff;
      color: #004085;
      border: none;
      border-radius: 10px;
      font-weight: 500;
    }

    /* Rodapé */
    footer {
      text-align: center;
      padding: 20px 0;
      margin-top: 30px;
      border-top: 1px solid #ccc;
      color: #555;
      font-size: 0.9rem;
    }

    /* Margens e espaçamentos */
    .container {
      max-width: 700px;
    }

  </style>
</head>
<body>

<div th:insert="navbar :: navigation"></div>

<!-- Begin Page Content -->
<div class="container mt-5">

  <div class="card shadow-lg mb-4">
    <div class="card-header py-3">
      <h6 class="m-0">Cadastro de Agendamento</h6>
    </div>
    <div class="card-body">

      <form th:action="@{/agendamento}" method="post" th:object="${agendamentoDto}">

        <label>Colaborador</label>
        <select th:field="*{colaborador}" class="form-control mb-3">
          <option value="">Selecione</option>
          <option th:each="c : ${usuarios}" th:value="${c.nome}" th:text="${c.nome}"></option>
        </select>

        <label>Recurso</label>
        <select th:field="*{recurso}" class="form-control mb-3">
          <option value="">Selecione</option>
          <option th:each="r : ${recursos}" th:value="${r.descricao}" th:text="${r.descricao}"></option>
        </select>

        <div class="col-12">
          <div class="form-floating mb-3">
            <input type="date" id="inicioAgendamento" name="inicioAgendamento" th:field="*{inicioAgendamento}" class="form-control form-control-lg" />
            <label for="inicioAgendamento">Data de agendamento</label>
          </div>
        </div>

        <div class="col-12">
          <div class="form-floating mb-3">
            <input type="date" id="fimAgendamento" name="fimAgendamento" th:field="*{fimAgendamento}" class="form-control form-control-lg" />
            <label for="fimAgendamento">Data de entrega</label>
          </div>
        </div>

        <div class="col-12">
          <div class="form-floating mb-3">
            <input type="time" id="horaInicio" name="horaInicio" th:field="*{horaInicio}" class="form-control form-control-lg" />
            <label for="horaInicio">Hora início</label>
          </div>
        </div>

        <div class="col-12">
          <div class="form-floating mb-3">
            <input type="time" id="horaFinal" name="horaFinal" th:field="*{horaFinal}" class="form-control form-control-lg" />
            <label for="horaFinal">Hora final</label>
          </div>
        </div>

        <div class="pt-1 mb-4 d-flex gap-2">
          <button class="btn btn-primary flex-fill" type="submit">Confirmar</button>
          <a th:href="@{/agendamentolista}" class="btn btn-secondary flex-fill">Fechar</a>
        </div>
      </form>

      <div th:if="${param.ins_sucesso}" class="alert alert-info mt-3" role="alert">
        Cadastro realizado com sucesso!
      </div>

      <div th:if="${param.upd_sucesso}" class="alert alert-info mt-3" role="alert">
        Cadastro atualizado com sucesso!
      </div>

    </div>
  </div>
</div>

<footer class="container">
  <p>© Turma 2025-2026</p>
</footer>

</body>
</html>
