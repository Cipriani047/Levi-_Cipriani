<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Usuários</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #f0f4f8, #d9e2ec);
            min-height: 100vh;
            color: #333;
        }

        .card {
            border-radius: 15px;
            background: #ffffffcc;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border: none;
        }

        .card-header {
            background-color: transparent;
            color: #007bff;
            font-weight: 700;
            border-bottom: 2px solid #007bff;
        }

        .btn-primary, .btn-warning, .btn-danger {
            border-radius: 10px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(90deg, #007bff, #0056b3);
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(90deg, #0056b3, #003f7f);
            box-shadow: 0 4px 12px rgba(0,123,255,0.4);
        }

        .btn-warning {
            background: linear-gradient(90deg, #ffc107, #e0a800);
            border: none;
            color: #fff;
        }

        .btn-warning:hover {
            background: linear-gradient(90deg, #e0a800, #c69500);
            box-shadow: 0 4px 12px rgba(255,193,7,0.4);
        }

        .btn-danger {
            background: linear-gradient(90deg, #dc3545, #a71d2a);
            border: none;
            color: #fff;
        }

        .btn-danger:hover {
            background: linear-gradient(90deg, #a71d2a, #700f1a);
            box-shadow: 0 4px 12px rgba(220,53,69,0.4);
        }

        .table thead th {
            background-color: #007bff33;
            color: #007bff;
        }

        .table tbody tr:hover {
            background-color: #f1f5f9;
        }

        footer {
            text-align: center;
            padding: 20px 0;
            margin-top: 30px;
            border-top: 1px solid #ccc;
            color: #555;
            font-size: 0.9rem;
        }

        .container {
            max-width: 900px;
        }
    </style>
</head>
<body>

<div th:insert="~{navbar :: navigation}"></div>

<div class="container mt-5">
    <div class="card shadow-lg">
        <div class="card-header py-3">
            <h5 class="m-0">Lista de Usuários</h5>
        </div>
        <div class="card-body">

            <p class="card-text mb-3">
                <a th:href="@{/usuariocadastro}" class="btn btn-primary">Inserir</a>
            </p>

            <div class="table-responsive">
                <table class="table table-bordered align-middle" width="100%" cellspacing="0">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Usuário</th>
                        <th>E-mail</th>
                        <th>Matrícula</th>
                        <th>Data de nascimento</th>
                        <th>Atualizar</th>
                        <th>Excluir</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="usuario: ${listaDto}">
                        <td th:text="${usuario.id}"></td>
                        <td th:text="${usuario.nome}"></td>
                        <td th:text="${usuario.email}"></td>
                        <td th:text="${usuario.matricula}"></td>
                        <td th:text="${usuario.dataNascimento}"></td>
                        <td>
                            <a th:href="@{'/usuarioatualizar/' + ${usuario.id}}" class="btn btn-warning">Alterar</a>
                        </td>
                        <td>
                            <button th:data-usuario-id="${usuario.id}" class="excluir btn btn-danger">Excluir</button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<script th:src="@{/usuarioexcluir.js}"></script>

<footer>
    <p>© Turma 2025-2026</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.4/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
