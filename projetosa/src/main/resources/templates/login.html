<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #f0f4f8, #d9e2ec);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            border-radius: 20px;
            background: #ffffffcc; /* transparente para o degradê aparecer */
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border: none;
            width: 100%;
            max-width: 400px;
        }

        .card h3 {
            font-weight: 700;
            color: #007bff;
        }

        .form-control {
            border-radius: 10px;
            border: 1px solid #ccc;
            transition: all 0.3s ease-in-out;
            background-color: #f8f9fa;
        }

        .form-control:focus {
            border-color: #007bff;
            box-shadow: 0 0 8px rgba(0,123,255,0.3);
            background-color: #ffffff;
        }

        .btn-primary {
            background: linear-gradient(90deg, #007bff, #0056b3);
            border: none;
            border-radius: 10px;
            font-weight: 500;
            transition: all 0.3s ease-in-out;
        }

        .btn-primary:hover {
            background: linear-gradient(90deg, #0056b3, #003f7f);
            box-shadow: 0 4px 15px rgba(0,123,255,0.4);
        }

        .alert {
            border-radius: 10px;
            font-weight: 500;
        }

        a {
            color: #007bff;
            transition: 0.3s;
        }

        a:hover {
            text-decoration: underline;
        }

        .mt-3.text-center {
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="card shadow-lg p-4">
    <div class="card-body">
        <h3 class="text-center mb-4">Login</h3>

        <form method="post" th:action="@{/login}" th:object="${loginDto}">
            <div class="mb-3">
                <label for="user_login" class="form-label">E-mail</label>
                <input type="email" class="form-control" th:field="*{email}" id="user_login" name="user_login" placeholder="Informe seu email" required/>
            </div>

            <div class="mb-3">
                <label for="user_password" class="form-label">Senha</label>
                <input type="password" class="form-control" th:field="*{senha}" id="user_password" name="user_password" placeholder="Informe sua senha" required/>
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </div>
        </form>

        <div class="mt-3 text-center">
            <a th:href="@{/usuariocadastro}">Não tem uma conta ainda? Cadastre-se!</a>
        </div>

        <div th:if="${param.sucesso}" class="alert alert-info mt-3" role="alert">
            Login realizado com sucesso!
        </div>

        <div th:if="${param.erro}" class="alert alert-danger mt-3" role="alert">
            Erro ao realizar login do usuário!
        </div>

        <div th:if="${param.logout}" class="alert alert-info mt-3" role="alert">
            Logout realizado com sucesso!
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.4/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
