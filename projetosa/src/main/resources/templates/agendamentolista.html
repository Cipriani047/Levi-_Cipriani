<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Lista de Agendamentos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #f0f4f8, #d9e2ec);
            color: #333;
        }

        table {
            color: #333;
        }

        th, td {
            vertical-align: middle;
        }

        /* Card */
        .card {
            border-radius: 15px;
            background: #ffffffcc; /* leve transparência para deixar o degradê aparecer */
            border: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .card-header {
            background-color: transparent;
            color: #007bff;
            font-weight: 700;
            border-bottom: 2px solid #007bff;
        }

        /* Botões */
        a.btn-primary {
            background-color: #007bff;
            border: none;
            transition: 0.3s;
        }
        a.btn-primary:hover {
            background-color: #0056b3;
        }

        a.btn-danger {
            background-color: #dc3545;
            border: none;
            transition: 0.3s;
        }
        a.btn-danger:hover {
            background-color: #b02a37;
        }

        /* Tabela */
        .table {
            background-color: #ffffffcc;
            border-radius: 10px;
            overflow: hidden;
        }

        .table th {
            background-color: #e9f2ff;
            border-bottom: 2px solid #007bff;
        }

        .table-hover tbody tr:hover {
            background-color: #f1f7ff;
        }

        /* Rodapé */
        footer {
            text-align: center;
            padding: 20px 0;
            margin-top: auto;
            border-top: 1px solid #ccc;
            color: #555;
            font-size: 0.9rem;
        }

        .container {
            max-width: 1000px;
        }

    </style>
</head>
<body>

<div th:insert="~{navbar :: navigation}"></div>

<div class="container mt-5">
    <div class="card shadow-lg mb-4">
        <div class="card-header py-3">
            <h6 class="m-0">Lista de Agendamentos</h6>
        </div>
        <div class="card-body">
            <p class="card-text">
                <a th:href="@{~/agendamentocadastro}" class="btn btn-primary">Inserir</a>
            </p>

            <div class="table-responsive">
                <table class="table table-bordered table-hover" id="dataTable" width="100%" cellspacing="0">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Colaborador</th>
                        <th>Recurso</th>
                        <th>Data de agendamento</th>
                        <th>Data de entrega</th>
                        <th>Hora início</th>
                        <th>Hora final</th>
                        <th>Status</th>
                        <th>Cancelar</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="agendamento : ${listaDto}">
                        <td th:text="${agendamento.id}"></td>
                        <td th:text="${agendamento.colaborador}"></td>
                        <td th:text="${agendamento.recurso}"></td>
                        <td th:text="${agendamento.inicioAgendamento}"></td>
                        <td th:text="${agendamento.fimAgendamento}"></td>
                        <td th:text="${agendamento.horaInicio}"></td>
                        <td th:text="${agendamento.horaFinal}"></td>
                        <td th:text="${agendamento.cancelamento}"></td>
                        <td>
                            <a th:href="@{/agendamento/agendamentocancelar/{id}(id=${agendamento.id})}" class="btn btn-danger">Cancelar</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<footer class="container mt-4">
    <p>© Turma 2025-2026</p>
</footer>

</body>
</html>
