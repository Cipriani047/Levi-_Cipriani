<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Recurso</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #f0f4f8, #d9e2ec);
            min-height: 100vh;
            color: #333;
        }

        .card {
            border-radius: 15px;
            background: #ffffffcc; /* leve transparência */
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border: none;
        }

        .card-header {
            background-color: transparent;
            color: #007bff;
            font-weight: 700;
            border-bottom: 2px solid #007bff;
        }

        .form-control {
            border-radius: 10px;
            border: 1px solid #ccc;
            transition: all 0.3s ease-in-out;
            background-color: #f8f9fa;
        }

        .form-control:focus {
            border-color: #007bff;
            box-shadow: 0 0 8px rgba(0,123,255,0.3);
            background-color: #ffffff;
        }

        .btn-primary, .btn-secondary {
            border-radius: 10px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(90deg, #007bff, #0056b3);
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(90deg, #0056b3, #003f7f);
            box-shadow: 0 4px 12px rgba(0,123,255,0.4);
        }

        .btn-secondary {
            background-color: #6c757d;
            color: #fff;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }

        footer {
            text-align: center;
            padding: 20px 0;
            margin-top: 30px;
            border-top: 1px solid #ccc;
            color: #555;
            font-size: 0.9rem;
        }

        .container {
            max-width: 900px;
        }

        .alert {
            border-radius: 10px;
            font-weight: 500;
        }
    </style>
</head>

<body>

<div th:insert="navbar :: navigation"></div>

<div class="container mt-5">
    <div class="card shadow-lg mb-4">
        <div class="card-header py-3">
            <h6 class="m-0">Atualizar Recurso</h6>
        </div>
        <div class="card-body">
            <form th:action="@{'/recurso/' + ${recursoDto.id}}" th:method="post" th:object="${recursoDto}" method="post">

                <!-- Descrição -->
                <div class="col-12">
                    <div class="form-floating mb-4">
                        <input type="text" id="descricao" th:field="*{descricao}" class="form-control form-control-lg"/>
                        <label for="descricao">Descrição</label>
                    </div>
                </div>

                <!-- Tipo -->
                <div class="col-12">
                    <div class="form-floating mb-4">
                        <input type="text" id="tipo" th:field="*{tipo}" class="form-control form-control-lg"/>
                        <label for="tipo">Tipo</label>
                    </div>
                </div>

                <!-- Dias disponíveis -->
                <div class="col-12">
                    <div class="form-floating mb-4">
                        <input type="text" id="diasDisponivel" th:field="*{diasDisponivel}" class="form-control form-control-lg"/>
                        <label for="diasDisponivel">Dias disponíveis</label>
                    </div>
                </div>

                <!-- Datas -->
                <div class="col-12">
                    <div class="form-floating mb-4">
                        <input type="date" id="dataInicialAgendamento" th:field="*{dataInicialAgendamento}" class="form-control form-control-lg"/>
                        <label for="dataInicialAgendamento">Data inicial de agendamento</label>
                    </div>
                </div>

                <div class="col-12">
                    <div class="form-floating mb-4">
                        <input type="date" id="dataFinalAgendamento" th:field="*{dataFinalAgendamento}" class="form-control form-control-lg"/>
                        <label for="dataFinalAgendamento">Data final de agendamento</label>
                    </div>
                </div>

                <!-- Horários -->
                <div class="col-12">
                    <div class="form-floating mb-4">
                        <input type="time" id="horaInicialAgendamento" th:field="*{horaInicialAgendamento}" class="form-control form-control-lg"/>
                        <label for="horaInicialAgendamento">Hora inicial de agendamento</label>
                    </div>
                </div>

                <div class="col-12">
                    <div class="form-floating mb-4">
                        <input type="time" id="horaFinalAgendamento" th:field="*{horaFinalAgendamento}" class="form-control form-control-lg"/>
                        <label for="horaFinalAgendamento">Hora final de agendamento</label>
                    </div>
                </div>

                <!-- Botões -->
                <div class="pt-1 mb-4">
                    <button class="btn btn-primary mb-2 me-2" type="submit">Confirmar</button>
                    <a th:href="@{/recursolista}" class="btn btn-secondary mb-2 me-2">Fechar</a>
                </div>
            </form>

            <div th:if="${param.ins_sucesso}" class="alert alert-info" role="alert">
                Cadastro realizado com sucesso!
            </div>

            <div th:if="${param.upd_sucesso}" class="alert alert-info" role="alert">
                Cadastro atualizado com sucesso!
            </div>

        </div>
    </div>
</div>

<footer class="container">
    <p>© Turma 2025-2026</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.4/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
