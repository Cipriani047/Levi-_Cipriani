<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Recursos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #f0f4f8, #d9e2ec);
            min-height: 100vh;
            color: #333;
        }

        .card {
            border-radius: 15px;
            background: #ffffffcc;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border: none;
        }

        .card-header {
            background-color: transparent;
            color: #007bff;
            font-weight: 700;
            border-bottom: 2px solid #007bff;
        }

        table {
            background-color: #fff;
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            vertical-align: middle;
            text-align: center;
        }

        .btn-primary, .btn-warning, .btn-danger {
            border-radius: 10px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(90deg, #007bff, #0056b3);
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(90deg, #0056b3, #003f7f);
            box-shadow: 0 4px 12px rgba(0,123,255,0.4);
        }

        .btn-warning {
            background: linear-gradient(90deg, #ffc107, #e0a800);
            border: none;
            color: #fff;
        }

        .btn-warning:hover {
            background: linear-gradient(90deg, #e0a800, #c69500);
            box-shadow: 0 4px 12px rgba(255,193,7,0.4);
        }

        .btn-danger {
            background: linear-gradient(90deg, #dc3545, #a71d2a);
            border: none;
            color: #fff;
        }

        .btn-danger:hover {
            background: linear-gradient(90deg, #a71d2a, #7a141f);
            box-shadow: 0 4px 12px rgba(220,53,69,0.4);
        }

        footer {
            text-align: center;
            padding: 20px 0;
            margin-top: 30px;
            border-top: 1px solid #ccc;
            color: #555;
            font-size: 0.9rem;
        }

        .container {
            max-width: 1100px;
        }

        .table-responsive {
            border-radius: 10px;
            overflow: hidden;
        }
    </style>
</head>

<body>

<div th:insert="~{navbar :: navigation}"></div>

<div class="container mt-5">
    <div class="card shadow-lg mb-4">
        <div class="card-header py-3">
            <h6 class="m-0">Lista de Recursos</h6>
        </div>
        <div class="card-body">

            <p class="card-text mb-3">
                <a th:href="@{/recursocadastro}" class="btn btn-primary">Inserir</a>
            </p>

            <div class="table-responsive">
                <table class="table table-bordered table-hover">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Descrição</th>
                        <th>Tipo</th>
                        <th>Dias disponíveis</th>
                        <th>Data inicial</th>
                        <th>Data final</th>
                        <th>Hora inicial</th>
                        <th>Hora final</th>
                        <th>Alterar</th>
                        <th>Excluir</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="recurso : ${listaDto}">
                        <td th:text="${recurso.id}"></td>
                        <td th:text="${recurso.descricao}"></td>
                        <td th:text="${recurso.tipo}"></td>
                        <td th:text="${recurso.diasDisponivel}"></td>
                        <td th:text="${recurso.dataInicialAgendamento}"></td>
                        <td th:text="${recurso.dataFinalAgendamento}"></td>
                        <td th:text="${recurso.horaInicialAgendamento}"></td>
                        <td th:text="${recurso.horaFinalAgendamento}"></td>
                        <td><a th:href="@{'/recursoatualizar/' + ${recurso.id}}" class="btn btn-warning">Alterar</a></td>
                        <td><button th:data-recurso-id="${recurso.id}" class="excluir btn btn-danger">Excluir</button></td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<script th:src="@{/recursoexcluir.js}"></script>

<footer class="container">
    <p>© Turma 2025-2026</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.4/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
