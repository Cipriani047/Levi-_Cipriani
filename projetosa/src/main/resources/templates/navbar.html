<!-- navbar.html -->
<nav th:fragment="navigation" class="navbar navbar-expand-lg shadow-sm"
     style="backdrop-filter: blur(10px); background-color: rgba(255,255,255,0.85);">
    <div class="container">
        <!-- Logo apenas -->
        <a class="navbar-brand" href="#">
            <img src="/img/mestres.png" alt="Logo" width="100" height="100">
        </a>

        <!-- Botão hambúrguer para responsivo -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Alternar navegação">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Links -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto fw-medium">
                <li class="nav-item">
                    <a class="nav-link text-dark" href="/usuariolista">Usuários</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-dark" href="/recursolista">Recursos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-dark" href="/agendamentolista">Agendamentos</a>
                </li>
                <li class="nav-item ms-3">
                    <form class="d-flex" th:action="@{/login?logout}" th:method="get">
                        <button class="btn btn-primary btn-sm fw-bold" type="submit">Sair</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<style>
    /* Navbar estilos modernos */
    .navbar-nav .nav-link {
        position: relative;
        transition: all 0.3s ease;
        font-weight: 500;
    }

    .navbar-nav .nav-link::after {
        content: '';
        position: absolute;
        width: 0;
        height: 2px;
        bottom: -3px;
        left: 0;
        background-color: #007bff;
        transition: width 0.3s;
    }

    .navbar-nav .nav-link:hover::after {
        width: 100%;
    }

    .navbar-nav .nav-link:hover {
        color: #007bff !important;
    }

    .btn-primary {
        background: linear-gradient(90deg, #007bff, #0056b3);
        border: none;
        border-radius: 10px;
        transition: all 0.3s ease;
    }

    .btn-primary:hover {
        background: linear-gradient(90deg, #0056b3, #003f7f);
        box-shadow: 0 4px 12px rgba(0,123,255,0.4);
    }
</style>
